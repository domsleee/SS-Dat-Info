[package]
name = "display-config"
version = "0.4.6"
description = "A launcher for Supreme Snowboarding."
authors = ["domslee"]
edition = "2024"
default-run = "display-config"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
opener = "0.8.5"
sysinfo = "0.39.6"
zip = { version = "8", default-features = false, features = ["deflate"] }
log = "0.4.34"
futures-util = "0.3.34"
anyhow = "1.0.104"
tauri-plugin-log = "2"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "native-tls", "stream", "system-proxy"] }
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-shell = "2"
once_cell = "1.21.4"
tauri-plugin-process = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

# From https://v2.tauri.app/concept/size/
[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
