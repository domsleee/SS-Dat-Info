name: tas-fast-lane

on:
  pull_request:
  push:
    branches:
      - main
      - tas

concurrency:
  group: tas-fast-lane-runtime
  cancel-in-progress: false

jobs:
  tasFastLane:
    name: tas:fast-lane
    runs-on:
      - self-hosted
      - windows
      - x64
    timeout-minutes: 90
    env:
      TAS_FAST_LANE_ARTIFACTS: TAS/artifacts/fast-lane/latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run TAS fast lane gates
        shell: pwsh
        run: ./scripts/run-tas-fast-lane.ps1 -ArtifactsDir "${env:TAS_FAST_LANE_ARTIFACTS}"
      - name: Upload TAS fast lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tas-fast-lane-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TAS_FAST_LANE_ARTIFACTS }}
          if-no-files-found: warn
