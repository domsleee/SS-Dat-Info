on:
  pull_request:
  push: # Run CI on the main branch after every merge. This is important to fill the GitHub Actions cache in a way that pull requests can see it
    branches:
      - main
name: ci
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyzeLint:
    name: analyze:lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd analyze && bun install --frozen-lockfile
      - run: cd analyze && bun run lint
      - run: cd analyze && bun run typecheck
  analyzeTest:
    name: analyze:test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd analyze && bun install --frozen-lockfile
      - run: cd analyze && bun run test
  threejsLint:
    name: threejs:lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd threejs && bun install --frozen-lockfile
      - run: cd threejs && bun run lint
      - run: cd threejs && bun run typecheck
  displayConfigBuild:
    name: displayConfig:build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Display_Config/Display_Config/src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cd Display_Config/Display_Config && bun install --frozen-lockfile
      - run: cd Display_Config/Display_Config && bun tauri build --debug -- --locked
  displayConfigBindings:
    name: displayConfig:bindings
    runs-on: windows-latest
    env:
      BINDINGS_PATH: "Display_Config/Display_Config/src/bindings.ts"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Display_Config/Display_Config/src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cd Display_Config/Display_Config && bun install --frozen-lockfile
      - run: cd Display_Config/Display_Config/src-tauri && cargo run --locked --bin codegen
      - name: Check if bindings.ts exists
        run: |
          if [ ! -f "${{ env.BINDINGS_PATH }}" ]; then
            echo "ERROR: bindings.ts does not exist at ${{ env.BINDINGS_PATH }}"
            exit 1
          fi
        shell: bash
      - name: Check if bindings.ts is unchanged
        run: |
          git diff --color HEAD -- "${{ env.BINDINGS_PATH }}"
          if [ $? -ne 0 ] || [ -n "$(git diff HEAD -- "${{ env.BINDINGS_PATH }}")" ]; then
            echo "bindings.ts has been modified"
            exit 1
          fi
        shell: bash
      - name: Run Rust tests
        if: ${{ !cancelled() }}
        run: cd Display_Config/Display_Config/src-tauri && cargo test --locked
  displayConfigLintRust:
    name: displayConfig:lintRust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Display_Config/Display_Config/src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cd Display_Config/Display_Config/src-tauri && cargo fmt --all --check
      - run: cd Display_Config/Display_Config/src-tauri && cargo clippy --locked -- -Dwarnings
  displayConfigLintVue:
    name: displayConfig:lintVue
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd Display_Config/Display_Config && bun install --frozen-lockfile
      - run: cd Display_Config/Display_Config && bun run lint
      - run: cd Display_Config/Display_Config && bun run typecheck
  displayConfigTest:
    name: displayConfig:test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd Display_Config/Display_Config && bun install --frozen-lockfile
      - run: cd Display_Config/Display_Config && bun run test
  displayConfigCppBuild:
    name: displayConfig:cppBuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Display_Config/Display_Config/src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@v4
      - uses: arduino/setup-task@v3
      - run: cd Display_Config/Display_Config && bun install --frozen-lockfile
      - run: cd Display_Config/Display_Config && just
  tasTest:
    name: tas:test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd TAS && cargo fmt --all --check
      - run: cd TAS && cargo clippy --workspace --all-targets -- -D warnings
      - name: Test TAS offline tools
        run: python -m unittest discover -s TAS/tools -p test_tools.py -v
      - run: cd TAS && cargo test --release
      - name: Build TAS native DLL
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vsPath\MSBuild\Current\Bin\MSBuild.exe" TAS/TAS_Helper/TAS_Helper.vcxproj /v:minimal /p:Configuration=Release /p:Platform=Win32 /m
      - name: Test TAS native policies
        shell: pwsh
        run: ./TAS/tools/test_dll_hidden.ps1
      - name: Build TAS Rust binaries for staging
        run: cd TAS && cargo build --release
      - name: Build injector (TAS payload)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vsPath\MSBuild\Current\Bin\MSBuild.exe" Display_Config/Display_Config_Resources/Injector/Injector.vcxproj /v:minimal /p:Configuration=Release /m
      - name: Stage and validate TAS payload layout
        shell: pwsh
        run: |
          $tas = 'payload/Display_Config_Resources/TAS'
          New-Item -ItemType Directory -Force $tas | Out-Null
          Copy-Item TAS/TAS_Helper/Release/TAS_Helper.dll "$tas/"
          Copy-Item TAS/target/release/tas_ui.exe "$tas/"
          Copy-Item TAS/target/release/tas_test.exe "$tas/"
          Copy-Item Display_Config/Display_Config_Resources/Injector/Release/Injector.exe 'payload/Display_Config_Resources/'
          foreach ($f in @(
            'payload/Display_Config_Resources/TAS/TAS_Helper.dll',
            'payload/Display_Config_Resources/TAS/tas_ui.exe',
            'payload/Display_Config_Resources/TAS/tas_test.exe',
            'payload/Display_Config_Resources/Injector.exe')) {
            if (-not (Test-Path $f)) { throw "payload missing: $f" }
          }
