[package]
name = "tas_ui"
version = "0.1.0"
edition = "2021"
description = "TAS UI for Supreme Snowboarding (egui/eframe)"

[dependencies]
tas_shared = { path = "../tas_shared" }
tas_codec = { path = "../tas_codec" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
serialport = { version = "4", features = ["usbportinfo-interface"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = "0.15"
single-instance = "0.3"
crc32fast = "1"
