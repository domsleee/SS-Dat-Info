[package]
name = "tas_ui"
version = "0.1.0"
edition = "2021"
description = "TAS UI for Supreme Snowboarding (egui/eframe)"

[dependencies]
tas_shared = { path = "../tas_shared" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "__screenshot"] }
egui = "0.29"
egui_plot = "0.29"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = "0.15"
single-instance = "0.3"
png = "0.17"
